name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Published with the static site. The default GITHUB_TOKEN in this public
# repo can enable and deploy GitHub Pages even when the box token cannot
# call the Pages admin API.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage published files
        run: |
          mkdir -p _site
          tar -C . --exclude='./.git' --exclude='./.github' --exclude='./_site' -cf - . | tar -C _site -xf -

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
